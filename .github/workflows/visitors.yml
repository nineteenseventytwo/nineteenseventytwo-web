name: visitors

# The home page's visitor counter: read yesterday's (and the past week's)
# visits from Cloudflare's analytics, add them to the running record in
# /counter.json, publish it. See events/src/visitors.mjs for how the count
# stays correct across re-runs and missed days.
#
# Daily, early: the counter is "since", not live, and a day's numbers have
# settled by then. Same credentials as gigs.yml for the bucket; the Cloudflare
# token is read-only analytics on the one zone.
on:
  schedule:
    - cron: "30 2 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: visitors
  cancel-in-progress: false

jobs:
  count:
    # Off until the Cloudflare zone is configured (CLOUDFLARE_ZONE_ID variable
    # and CLOUDFLARE_ANALYTICS_TOKEN secret), rather than failing nightly.
    if: vars.CLOUDFLARE_ZONE_ID != ''
    runs-on: ubuntu-latest
    environment: aws-prod
    permissions:
      contents: read
      id-token: write
    env:
      SITE_BUCKET: ${{ vars.SITE_BUCKET }}
      SITE_HOST: sev.eightbitsaxlounge.com
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Count
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_ANALYTICS_TOKEN }}
          CF_ZONE_ID: ${{ vars.CLOUDFLARE_ZONE_ID }}
        run: >-
          node events/src/visitors.mjs
          --previous "https://${SITE_HOST}/counter.json"
          --out build/counter.json

      - name: Summary
        run: |
          node -e '
            const c = require("./build/counter.json");
            const recent = Object.entries(c.days).slice(-7).map(([d, n]) => `| ${d} | ${n} |`);
            console.log(["## Visitors", "", `**${c.total}** since ${c.since}`, "", "| Day | Visits |", "|---|---|", ...recent].join("\n"));
          ' >> "$GITHUB_STEP_SUMMARY"

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: eu-west-2

      - name: Publish
        run: >-
          aws s3 cp build/counter.json "s3://${SITE_BUCKET}/counter.json"
          --content-type application/json
          --cache-control "public,max-age=300"
      - name: Invalidate
        if: vars.CLOUDFRONT_DISTRIBUTION_ID != ''
        run: >-
          aws cloudfront create-invalidation
          --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}"
          --paths "/counter.json"
