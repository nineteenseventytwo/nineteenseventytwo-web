<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 878" width="480" height="878" role="img" aria-labelledby="t d"><title id="t">The nineteenseventytwo platform</title><desc id="d">Cloudflare and GitHub at the top. Below them the home lab on VLAN 20: a console Pi that builds the cluster, a three-node Raspberry Pi Kubernetes cluster running Argo CD, Vault, Longhorn, Prometheus and Grafana, cert-manager and GitHub runners, plus two apps, and a dual-boot PC for streaming and GPU inference. Pods sign in to an AWS Organization of five accounts with short-lived credentials; this website is served from the platform-prod account.</desc><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#000"/></marker></defs><rect x="1" y="1" width="478" height="876" fill="#c0c0c0"/>
