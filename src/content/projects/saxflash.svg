<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 700" width="480" height="700" role="img" aria-labelledby="t d"><title id="t">SaxFlash, the plan</title><desc id="d">A work-in-progress plan. A mic hears the alto saxophone, and a vibration sensor feels the horn being slapped. A small microcontroller runs an FFT on the sound, picks the note in the alto range (about 139 to 831 Hz), and lights LED strips soldered to the sax in that note's colour, one of twelve; a slap triggers a flash effect. A lithium battery pack through a step-down converter powers everything, so there is no cable to the wall.</desc><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#000"/></marker></defs><rect x="1" y="1" width="478" height="698" fill="#c0c0c0"/>
