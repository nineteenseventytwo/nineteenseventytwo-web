<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 846" width="480" height="846" role="img" aria-labelledby="t d"><title id="t">How 8 Bit Sax Lounge works</title><desc id="d">A viewer types a command such as !engine room in Twitch chat. The chat bot in the Kubernetes cluster receives it, asks the MIDI proxy to change the effect, and publishes an event to NATS. The MIDI proxy records the new state through the data API in CouchDB and forwards the change to the MIDI device service on the Windows PC, which sends a MIDI message over USB to the reverb pedal on the saxophone's signal. The overlay service turns the NATS event into an on-screen update in OBS, and OBS streams the result back to Twitch.</desc><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#000"/></marker></defs><rect x="1" y="1" width="478" height="844" fill="#c0c0c0"/>
