<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 822" width="480" height="822" role="img" aria-labelledby="t d"><title id="t">How the composer arranges a score</title><desc id="d">A piano score from a game soundtrack goes in as MusicXML. The composer service in the cluster splits it into melody, bass and harmony, decodes each bar's chord from the score itself, then arranges it as bossa nova - by rule, or with a language model on the PC's GPU choosing density, bass feel and substitutions. Out come five staves: four for Game Boy channels in LSDj and one for the alto sax, played live.</desc><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#000"/></marker></defs><rect x="1" y="1" width="478" height="820" fill="#c0c0c0"/>
