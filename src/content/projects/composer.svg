<text x="33" y="445" font-family="Verdana, Geneva, Tahoma, sans-serif" font-size="12" font-weight="normal" fill="#000" text-anchor="start">Five staves, one per performer,</text>
<text x="33" y="460" font-family="Verdana, Geneva, Tahoma, sans-serif" font-size="12" font-weight="normal" fill="#000" text-anchor="start">back out as MusicXML</text>
