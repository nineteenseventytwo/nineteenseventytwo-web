<text x="33" y="329" font-family="Verdana, Geneva, Tahoma, sans-serif" font-size="12" font-weight="normal" fill="#000" text-anchor="start">deterministic: all rules, no model</text>
<text x="33" y="344" font-family="Verdana, Geneva, Tahoma, sans-serif" font-size="12" font-weight="normal" fill="#000" text-anchor="start">plan: a model picks density, bass feel and</text>
<text x="33" y="359" font-family="Verdana, Geneva, Tahoma, sans-serif" font-size="12" font-weight="normal" fill="#000" text-anchor="start">  chord substitutions from the options</text>
<text x="33" y="374" font-family="Verdana, Geneva, Tahoma, sans-serif" font-size="12" font-weight="normal" fill="#000" text-anchor="start">notes: model rewrites notes (kept to compare)</text>
